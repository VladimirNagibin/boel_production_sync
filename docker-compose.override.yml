services:
  bp_sync:
    volumes:
      - ./bp_sync/src:/opt/app
      - code-data:/opt/app/data
    env_file:
      - ./.env
    ports:
     - 8000:8000

  bp_sync-migrations:
    volumes:
      - ./bp_sync/src:/opt/app
    env_file:
      - ./.env

  web:
    ports:
      - "8080:80"
    volumes:
      - ./bitrix_php/src:/var/www/html/
    env_file:
      - ./.env


  db:
    ports:
     - 5442:5432
    env_file:
      - ./.env

  redis:
    ports:
      - 6379:6379

  ftp:
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_PASS=${FTP_PASS}
      - PASV_ADDRESS=${PASV_ADDRESS}   # Крайне важно: укажите публичный IP вашего сервера или доменное имя
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    ports:
      - "21:21"
      - "21100-21110:21100-21110"      # Диапазон портов пассивного режима должен совпадать с настройками выше
    volumes:
      - ./bitrix_php/ftp:/home/vsftpd           # Постоянное хранилище
    # Если нужно, чтобы FTP-сервер и bp_sync использовали общую директорию с файлами,
    # можно также смонтировать code-data или отдельный volume в нужную точку
